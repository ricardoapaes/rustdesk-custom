name: Cleanup Old Container Images

on:
  schedule:
    # Executa todo domingo às 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete old container images
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'rustdesk-custom'
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old development images
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'rustdesk-custom'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🧹 Container Image Cleanup Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Kept last 10 tagged versions" >> $GITHUB_STEP_SUMMARY
          echo "- Kept last 5 development versions" >> $GITHUB_STEP_SUMMARY
          echo "- Deleted all untagged versions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This helps keep the registry clean and reduces storage costs." >> $GITHUB_STEP_SUMMARY